name: Immigra quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check public configuration with a hosting environment variable
        run: node --test modules/citizenship/tests/account-foundation.test.mjs
        env:
          SUPABASE_PUBLISHABLE_KEY: ci-public-fixture
      - run: npm run build
