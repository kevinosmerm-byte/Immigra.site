# Render Blueprint for CitizenshipAI's private API service.
services:
  - type: web
    name: citizenshipai-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: USCIS_CLIENT_ID
        sync: false
      - key: USCIS_CLIENT_SECRET
        sync: false
      - key: USCIS_TOKEN_URL
        sync: false
      - key: USCIS_API_URL
        sync: false
